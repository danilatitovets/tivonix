<!doctype html>
<html lang="ru" data-lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Auto language (first visit): RU if browser has ru, else EN; does NOT override manual choice (localStorage) -->
    <script>
      (function () {
        var STORAGE_KEY = "tivonix_lang";
        function pickLang() {
          try {
            var url = new URL(window.location.href);
            var qp = url.searchParams.get("lang");
            if (qp === "ru" || qp === "en") return qp;
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved === "ru" || saved === "en") return saved;
          } catch (_) {}
          var nav = (navigator.languages && navigator.languages.length ? navigator.languages.join(",") : navigator.language) || "";
          return /(^|,|\s)ru(-|_|$)/i.test(nav) ? "ru" : "en";
        }
        var lang = pickLang();
        document.documentElement.lang = lang;
        document.documentElement.dataset.lang = lang;
        window.__TIVONIX_LANG__ = lang;
      })();
    </script>

    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="alternate" hreflang="ru" href="https://tivonix.tech/?lang=ru" />
    <link rel="alternate" hreflang="en" href="https://tivonix.tech/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://tivonix.tech/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
