<!doctype html>
<html lang="ru" data-lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#fc5000" />
    <link rel="preload" as="image" href="/images/hero-stage-1.webp" type="image/webp" fetchpriority="high" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body style="margin: 0; background-color: #000;">
    <script>
      (function () {
        try {
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          var lang = "ru";
          if (path === "/en" || path.indexOf("/en/") === 0) {
            lang = "en";
          } else if (path === "/ru" || path.indexOf("/ru/") === 0 || path === "/partners") {
            lang = "ru";
          } else if (
            path === "/" ||
            path === "/plans" ||
            path === "/about" ||
            path === "/projects" ||
            path === "/contacts"
          ) {
            lang = "ru";
            try {
              var stored = localStorage.getItem("tivonix_lang");
              if (stored === "en") {
                var target = path === "/" ? "/en" : "/en" + path;
                location.replace(target + location.search + location.hash);
                return;
              }
            } catch (e2) {
              /* ignore */
            }
          } else {
            var qp = new URLSearchParams(location.search).get("lang");
            if (qp === "en" || qp === "ru") {
              lang = qp;
            } else {
              try {
                var storedOther = localStorage.getItem("tivonix_lang");
                if (storedOther === "en" || storedOther === "ru") {
                  lang = storedOther;
                }
              } catch (e3) {
                /* ignore */
              }
            }
          }

          // Do not mutate <html lang|data-lang> here — prerender already set them
          // to match SSR, and changing attributes before hydrateRoot causes #418.
          window.__TIVONIX_LANG__ = lang;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
