<!doctype html>
<html lang="ru" data-lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var STORAGE_KEY = "tivonix_lang";
        function pickLang() {
          try {
            var url = new URL(window.location.href);
            var qp = url.searchParams.get("lang");
            if (qp === "ru" || qp === "en") return qp;
          } catch (_) {}
          if (window.location.pathname.startsWith("/en")) return "en";
          return "ru";
        }
        var lang = pickLang();
        document.documentElement.lang = lang;
        document.documentElement.dataset.lang = lang;
        window.__TIVONIX_LANG__ = lang;
      })();
    </script>

    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body style="margin: 0; background-color: #000;">

          <p>Под задачи вашего бизнеса: лендинги, веб-сервисы, MVP, админки, интеграции, Telegram для заявок. React и TypeScript.</p>
          <p>Портфолио и контакты — на www.tivonix.tech.</p>
        </div>
