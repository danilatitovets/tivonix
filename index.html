<html lang="ru" data-lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- До гидрации: совпадает с DICT.ru.hero в LangProvider.tsx (меняйте там и здесь вместе). -->
    <title>TIVONIX — Сделаем сайт или веб-сервис</title>
    <meta name="description" content="Разберём идею, спроектируем интерфейс, разработаем продукт и подготовим его к запуску. Всё — в одном месте и без технической путаницы.">
    <meta name="keywords" content="создать сайт, создать лендинг, заказать mvp, telegram бот для заявок, разработка сайта, веб студия, saas разработка, tivonix">

    <meta property="og:title" content="TIVONIX — Сделаем сайт или веб-сервис">
    <meta property="og:description" content="Разберём идею, спроектируем интерфейс, разработаем продукт и подготовим его к запуску. Всё — в одном месте и без технической путаницы.">
    <meta property="og:url" content="https://tivonix.tech/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://tivonix.tech/og.jpg"> <script>
      (function () {
        var STORAGE_KEY = "tivonix_lang";
        function pickLang() {
          try {
            var url = new URL(window.location.href);
            var qp = url.searchParams.get("lang");
            if (qp === "ru" || qp === "en") return qp;
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved === "ru" || saved === "en") return saved;
          } catch (_) {}
          var nav = (navigator.languages && navigator.languages.length ? navigator.languages.join(",") : navigator.language) || "";
          return /(^|,|\s)ru(-|_|$)/i.test(nav) ? "ru" : "en";
        }
        var lang = pickLang();
        document.documentElement.lang = lang;
        document.documentElement.dataset.lang = lang;
        window.__TIVONIX_LANG__ = lang;
      })();
    </script>

    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- hreflang для всех маршрутов задаётся в React (SEO.tsx), чтобы не дублировать и совпадать с URL страницы -->
  </head>

          <p>Портфолио и контакты — на tivonix.tech.</p>
