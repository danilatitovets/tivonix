<!doctype html>
<html lang="ru" data-lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var w = window;
          var ios = /iPhone|iPad|iPod/i.test(ua);
          var inApp =
            w.TelegramWebviewProxy != null ||
            w.TelegramWebviewProxyProto != null ||
            w.TelegramWebview != null ||
            w.TelegramGameProxy != null ||
            (w.Telegram && w.Telegram.WebApp) ||
            /Telegram|VKAndroidApp|vk_app|VKontakte|VKApp|Viber|Instagram|FBAN|FBAV|FB_IAB|FBIOS|WhatsApp|Line\/|Snapchat|BytedanceWebview|TikTok|musical_ly|MicroMessenger/i.test(
              ua
            ) ||
            (/Android/i.test(ua) && /; wv\)/i.test(ua)) ||
            (ios && /AppleWebKit/i.test(ua) && !/Safari\//i.test(ua));
          // iOS always uses JS scrub — Telegram sheet shares Safari UA and breaks sticky
          if (inApp || ios) {
            document.documentElement.classList.add("tg-webview", "inapp-webview");
            document.documentElement.setAttribute("data-scrub", "js");
            if (inApp) w.__TIVONIX_INAPP__ = true;
            w.__TIVONIX_JS_SCRUB__ = true;
          }
          var n = 0;
          var t = setInterval(function () {
            n += 1;
            if (
              w.TelegramWebviewProxy != null ||
              w.TelegramWebviewProxyProto != null ||
              w.TelegramWebview != null ||
              w.TelegramGameProxy != null
            ) {
              document.documentElement.classList.add("tg-webview", "inapp-webview");
              document.documentElement.setAttribute("data-scrub", "js");
              w.__TIVONIX_INAPP__ = true;
              w.__TIVONIX_JS_SCRUB__ = true;
              clearInterval(t);
            } else if (n > 50) {
              clearInterval(t);
            }
          }, 80);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#fc5000" />
    <link rel="preload" as="image" href="/images/hero-bg-poster.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero-stage-1.webp" type="image/webp" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body style="margin: 0; background-color: #000;">
    <script>
      (function () {
        try {
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          var lang = "ru";
          if (path === "/en" || path.indexOf("/en/") === 0) {
            lang = "en";
          } else if (path === "/zh" || path.indexOf("/zh/") === 0) {
            lang = "zh";
          } else if (path === "/ru" || path.indexOf("/ru/") === 0 || path === "/partners") {
            lang = "ru";
          } else if (
            path === "/" ||
            path === "/plans" ||
            path === "/about" ||
            path === "/projects" ||
            path === "/contacts"
          ) {
            lang = "ru";
            try {
              var stored = localStorage.getItem("tivonix_lang");
              if (stored === "en" || stored === "zh") {
                var target = path === "/" ? "/" + stored : "/" + stored + path;
                location.replace(target + location.search + location.hash);
                return;
              }
            } catch (e2) {
              /* ignore */
            }
          } else {
            var qp = new URLSearchParams(location.search).get("lang");
            if (qp === "en" || qp === "ru" || qp === "zh") {
              lang = qp;
            } else {
              try {
                var storedOther = localStorage.getItem("tivonix_lang");
                if (storedOther === "en" || storedOther === "ru" || storedOther === "zh") {
                  lang = storedOther;
                }
              } catch (e3) {
                /* ignore */
              }
            }
          }

          // Do not mutate <html lang|data-lang> here — prerender already set them
          // to match SSR, and changing attributes before hydrateRoot causes #418.
          window.__TIVONIX_LANG__ = lang;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
